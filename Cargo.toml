[package]
name = "redact-tool"
version = "0.1.0"
edition = "2021"
description = "Redact thong tin nhay cam truoc khi dua tai lieu len AI - 100% local, zero telemetry"
license = "MIT"
authors = ["Linh An Solutions"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
pdf-extract = "0.7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
lto = true
strip = true
