[package]
name = "redact-cli"
version = "0.2.1"
edition = "2021"
description = "Redact GUI CLI — redact thong tin nhay cam truoc khi dua tai lieu len AI, 100% local"
license = "MIT"
authors = ["Linh An Solutions"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
pdf-extract = "0.7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
lto = true
strip = true

[workspace]
members = ["gui"]
