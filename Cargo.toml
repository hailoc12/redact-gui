[package]
name = "redact-cli"
version = "0.4.0"
edition = "2021"
description = "Redact GUI CLI — redact thong tin nhay cam truoc khi dua tai lieu len AI, 100% local"
license = "MIT"
authors = ["Linh An Solutions"]

[features]
default = []
# Bản tổ chức (org-mode): bật activity log POST về API nội bộ.
# Bản release cá nhân KHÔNG bật — zero network code trong binary.
org-logging = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
pdf-extract = "0.7"
quick-xml = "0.38"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
lto = true
strip = true

[workspace]
members = ["gui"]
